name: Actualizar Resultados de F1 (Prácticas)

on:
  schedule:
    # Se ejecutará cada 3 horas los días Viernes y Sábados (días de prácticas)
    # Cron format: min hour day_of_month month day_of_week
    - cron: '0 10-23/3 * * 5,6'
  workflow_dispatch: # Permite ejecutar el bot manualmente desde GitHub

jobs:
  update-practice-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para hacer git commit

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Acelera la instalación guardando dependencias en caché

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Opcional: Cachear la carpeta de datos de FastF1 para no abusar de sus servidores
      - name: Cache Fast-F1 Data
        uses: actions/cache@v4
        with:
          path: .fastf1_cache
          key: fastf1-cache-${{ github.run_id }}
          restore-keys: |
            fastf1-cache-

      - name: Ejecutar Script de Extracción de Datos
        run: python scripts/update_practices.py

      - name: Hacer Commit y Push si hay cambios
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/practiceResults.json
          
          # git diff-index verifica silenciosamente si hay archivos trackeados modificados
          git diff-index --quiet HEAD || git commit -m "🤖 Auto-update: Resultados de Prácticas F1"
          
          # Hacemos push de los cambios (si no hubo commit, esto no hará nada)
          git push
